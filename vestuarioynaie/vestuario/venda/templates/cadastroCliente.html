<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Cliente</title>
  {% load bootstrap5 %}
  {% bootstrap_css %}
  {% bootstrap_javascript %}
</head>
<body>
    <main>
        <div class="container">
            <h1>Cadastro de Cliente</h1>
             {% bootstrap_messages %}
            <form action="{% url 'CadastraCliente' %}" method="POST" class="form" enctype='multipart/form-data'>
                {% csrf_token %}
                {% bootstrap_form form %}
                {% buttons %}
                <button type="submit" class="btn btn-primary">Cadastrar</button>
                {% endbuttons %}
            </form>
        </div>
    </main>
</body>
</html>
